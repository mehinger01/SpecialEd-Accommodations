openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Special Education Accommodation Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: PDF document management
  - name: students
    description: Student records
  - name: accommodations
    description: Accommodation entries
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Dashboard statistics
      description: Returns counts and summary data for the dashboard
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all uploaded documents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, parsed, error]
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a PDF document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUpload"
      responses:
        "201":
          description: Document uploaded and queued for parsing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document with parsed accommodations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document detail with accommodations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document and its accommodations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student with their accommodations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student detail with accommodations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student and unassign their documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /students/{id}/accommodations:
    get:
      operationId: getStudentAccommodations
      tags: [students]
      summary: Get all accommodations for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of accommodations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accommodation"

  /accommodations:
    get:
      operationId: listAccommodations
      tags: [accommodations]
      summary: List all accommodations
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: studentId
          in: query
          required: false
          schema:
            type: integer
        - name: documentId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of accommodations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Accommodation"

  /accommodations/{id}:
    get:
      operationId: getAccommodation
      tags: [accommodations]
      summary: Get a single accommodation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Accommodation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAccommodation
      tags: [accommodations]
      summary: Update an accommodation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccommodationUpdate"
      responses:
        "200":
          description: Updated accommodation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accommodation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAccommodation
      tags: [accommodations]
      summary: Delete an accommodation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /accommodations/by-category:
    get:
      operationId: getAccommodationsByCategory
      tags: [accommodations]
      summary: Accommodations grouped by category with counts
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /recent-activity:
    get:
      operationId: getRecentActivity
      tags: [documents]
      summary: Recent document uploads and parse events
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Stats:
      type: object
      properties:
        totalDocuments:
          type: integer
        parsedDocuments:
          type: integer
        totalStudents:
          type: integer
        totalAccommodations:
          type: integer
        pendingDocuments:
          type: integer
        errorDocuments:
          type: integer
      required:
        - totalDocuments
        - parsedDocuments
        - totalStudents
        - totalAccommodations
        - pendingDocuments
        - errorDocuments

    Document:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        documentType:
          type: string
          enum: [IEP, "504", BIP, OTHER]
        status:
          type: string
          enum: [pending, parsed, error]
        studentId:
          type: ["integer", "null"]
        studentName:
          type: ["string", "null"]
        accommodationCount:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        parsedAt:
          type: ["string", "null"]
          format: date-time
        parseError:
          type: ["string", "null"]
      required:
        - id
        - filename
        - documentType
        - status
        - studentId
        - studentName
        - accommodationCount
        - uploadedAt
        - parsedAt
        - parseError

    DocumentUpload:
      type: object
      properties:
        documentType:
          type: string
          enum: [IEP, "504", BIP, OTHER]
        studentId:
          type: integer
      required:
        - documentType

    DocumentDetail:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        documentType:
          type: string
          enum: [IEP, "504", BIP, OTHER]
        status:
          type: string
          enum: [pending, parsed, error]
        studentId:
          type: ["integer", "null"]
        studentName:
          type: ["string", "null"]
        accommodationCount:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        parsedAt:
          type: ["string", "null"]
          format: date-time
        parseError:
          type: ["string", "null"]
        rawTextPreview:
          type: ["string", "null"]
        parseWarnings:
          type: array
          items:
            type: string
        accommodations:
          type: array
          items:
            $ref: "#/components/schemas/Accommodation"
      required:
        - id
        - filename
        - documentType
        - status
        - studentId
        - studentName
        - accommodationCount
        - uploadedAt
        - parsedAt
        - parseError
        - rawTextPreview
        - parseWarnings
        - accommodations

    CreateStudentBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
      required:
        - displayName

    Student:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        gradeLevel:
          type: string
        caseManager:
          type: string
        planType:
          type: string
          enum: [IEP, "504", BIP, NONE]
        accommodationCount:
          type: integer
        pendingCount:
          type: integer
        approvedCount:
          type: integer
        documentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - gradeLevel
        - caseManager
        - planType
        - accommodationCount
        - pendingCount
        - approvedCount
        - documentCount
        - createdAt

    StudentDetail:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        gradeLevel:
          type: string
        caseManager:
          type: string
        planType:
          type: string
          enum: [IEP, "504", BIP, NONE]
        accommodationCount:
          type: integer
        documentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        accommodations:
          type: array
          items:
            $ref: "#/components/schemas/Accommodation"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
      required:
        - id
        - displayName
        - gradeLevel
        - caseManager
        - planType
        - accommodationCount
        - documentCount
        - createdAt
        - accommodations
        - documents

    Accommodation:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: ["integer", "null"]
        documentId:
          type: ["integer", "null"]
        accommodationName:
          type: ["string", "null"]
        category:
          type: string
        description:
          type: string
        sourceSection:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        rawText:
          type: ["string", "null"]
        isReviewed:
          type: boolean
        isApproved:
          type: ["boolean", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - studentId
        - documentId
        - accommodationName
        - category
        - description
        - sourceSection
        - startDate
        - endDate
        - location
        - rawText
        - isReviewed
        - isApproved
        - notes
        - createdAt
        - updatedAt

    AccommodationUpdate:
      type: object
      properties:
        category:
          type: string
        description:
          type: string
        isReviewed:
          type: boolean
        isApproved:
          type: boolean
        notes:
          type: string

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [upload, parsed, error, review]
        documentId:
          type: ["integer", "null"]
        documentName:
          type: ["string", "null"]
        studentName:
          type: ["string", "null"]
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - documentId
        - documentName
        - studentName
        - message
        - occurredAt
